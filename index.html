<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}
img{max-width:100%}[hidden]{display:none!important}
.login{display:flex;flex-direction:column;gap:12px;max-width:420px;margin:24px auto}
.login .logo{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.login .logo svg{width:64px;height:64px}
.login .logo b{font-family:var(--f-display);font-size:26px}
.login .logo b span{font-weight:500;color:var(--good)}
.offline{position:fixed;left:0;right:0;top:0;z-index:40;text-align:center;font-size:12px;font-weight:600;padding:calc(4px + env(safe-area-inset-top,0px)) 8px 4px;background:var(--warn);color:#fff}

/* Layout: one-column phone app, sticky header, bottom tab bar, floating "+" that opens a bottom sheet */
:root{
  --bg:#EDF0EE; --surface:#FFFFFF; --line:#D8DEDA; --ink:#17201C; --muted:#5F6B65;
  --accent:#B9475E; --accent-ink:#FFFFFF; --accent-soft:#F6E3E7;
  --good:#2F7D55; --warn:#A86A12; --bad:#B23A3A;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --leaf:#5DA86E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1B2220; --line:#2C3632; --ink:#E7ECE9; --muted:#97A39D;
  --accent:#E07C91; --accent-ink:#1A0E11; --accent-soft:#3A2228;
  --good:#5DBB88; --warn:#E0A64B; --bad:#E57373; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1B2220; --line:#2C3632; --ink:#E7ECE9; --muted:#97A39D;
  --accent:#E07C91; --accent-ink:#1A0E11; --accent-soft:#3A2228;
  --good:#5DBB88; --warn:#E0A64B; --bad:#E57373; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px;max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:42px;height:42px;flex:none}
.bt{min-width:0}
.bname{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.04em;color:var(--ink);line-height:1.1}
.bname span{font-weight:500;color:var(--good)}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;flex:1;letter-spacing:-.01em;text-wrap:balance}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 14px}
.monthbar b{font-weight:600}
.monthbar button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px}
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.card h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.hero{background:var(--ink);color:var(--bg);border:none}
.hero .big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;letter-spacing:-.02em}
.hero .lbl{opacity:.75;font-size:13px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{border-radius:999px;padding:4px 10px;font-size:13px;background:rgba(127,127,127,.18)}
.chip b{font-weight:700}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:baseline}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.bars{display:flex;flex-direction:column;gap:10px}
.bar .row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar .track{height:8px;border-radius:4px;background:var(--bg);margin-top:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:4px}
.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:4px;font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.li .s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.li .v{text-align:right;font-weight:600;white-space:nowrap}
.li .v small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--muted)}
.tag.plus{color:var(--good)} .tag.minus{color:var(--bad)} .tag.move{color:var(--accent)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.low{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.neg{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.date{width:46px;flex:none;text-align:center;font-size:12px;color:var(--muted);line-height:1.15}
.date b{display:block;font-size:18px;color:var(--ink);font-family:var(--f-display);font-weight:500}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.banner{font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:10px;padding:8px 12px}
.demo-note{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.vbtn{position:relative}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.pill.due{background:var(--accent-soft);color:var(--accent)}
.pill.soon{background:var(--bg);color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0}
.sheet .kv dd{text-align:left}
.stat{display:flex;flex-wrap:wrap;gap:6px}
.pill.preg{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.lact{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.open{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.ret{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.cull,.pill.none{background:var(--bg);color:var(--muted)}
.btns.wrap{flex-wrap:wrap}.btns.wrap .btn{flex:1 1 30%}
.fab{position:fixed;z-index:11;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.2;fill:none}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:640px;max-height:90%;overflow-y:auto;
  background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h3{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0 0 14px}
.sheet h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;font-weight:600}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;text-align:left;font-weight:600}
.act small{display:block;font-weight:400;color:var(--muted);font-size:12px}
form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{font-size:12px;color:var(--muted);margin-top:-4px}
.err{color:var(--bad);font-size:14px;font-weight:500}
.btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;border-radius:12px;padding:13px;font-weight:700;border:1px solid var(--line);background:var(--bg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

async function put(col,id,data){
  data={...data};if(!data.t)data.t=Date.now();
  if(db){const ref=id?db.collection(col).doc(id):db.collection(col).doc();ref.set(data).catch(e=>toast(saveErr(e)));return}
  id=id||('x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const i=S[col].findIndex(x=>x.id===id);const doc={id,...data};
  if(i>=0)S[col][i]=doc;else S[col].push(doc);saveLocal();schedule();
}

function sowState(s){
  const ev=sowEvents(s.id),last=ev[ev.length-1],st={ev,last};
  if(s.status==='Вибракувана'){st.code='cull';st.label='Вибракувана';return st}
  if(!last){st.code='none';st.label='Немає подій';return st}
  st.days=ageDays(last.date)-1;
  if(last.kind==='mate'){st.code='preg';st.exp=addDays(last.date,GEST);st.label=`Поросна · ${st.days} дн.`}
  else if(last.kind==='farrow'){st.code='lact';st.label=`Підсисна · ${st.days} дн.`}

function reminders(){
  const td=today(),wk=addDays(td,7),old=addDays(td,-30),out=[];
  const done=new Set(S.vet.filter(v=>v.plan&&v.batch).map(v=>v.batch+'__'+v.plan));S.vetskip.forEach(x=>done.add(x.batch+'__'+x.plan));
  const P=an=>S.vetplan.filter(p=>p.anchor===an&&p.from!==''&&p.from!=null&&Number.isFinite(+p.from));
  const span=p=>{const x=+p.from,y=(p.to===''||p.to==null||!Number.isFinite(+p.to))?x:+p.to;return[Math.min(x,y),Math.max(x,y)]};
  const push=(p,batch,a,b,ctx)=>{if(done.has(batch+'__'+p.id))return;let st='';
    if(b<td){if(b>=old)st='over'}else if(a<=td)st='now';else if(a<=wk)st='soon';if(st)out.push({p,batch,a,b,st,...ctx})};
  const states={};S.sows.forEach(s=>states[s.id]=sowState(s));
  for(const m of S.moves)if(m.type==='birth'&&m.date){
    const sow=m.sow?byId('sows',m.sow):null,sst=sow&&states[sow.id];
    const closed=sow&&(sst.code==='cull'||sst.last?.id!==m.id);
    for(const p of P(A_BIRTH)){const forSow=p.target==='Свиноматки';if(forSow&&closed)continue;
      const[x,y]=span(p);push(p,m.id,addDays(m.date,x-1),addDays(m.date,y-1),{m,sow:forSow?sow:null})}
  }
  for(const s of S.sows){const st=states[s.id],L=st.last;if(st.code==='cull'||!L)continue;
    if(L.kind==='mate'){
      for(const p of P(A_MATE)){const[x,y]=span(p);push(p,L.id,addDays(L.date,x),addDays(L.date,y),{sow:s,ev:L,exp:st.exp})}
      for(const p of P(A_PRE)){const[x,y]=span(p);push(p,L.id,addDays(st.exp,-y),addDays(st.exp,-x),{sow:s,ev:L,exp:st.exp})}}
    if(L.kind==='wean')for(const p of P(A_WEAN)){const[x,y]=span(p);push(p,L.id,addDays(L.date,x),addDays(L.date,y),{sow:s,ev:L})}
  }
  const rank={over:0,now:1,soon:2};
  return out.sort((x,y)=>rank[x.st]-rank[y.st]||(x.st==='soon'?x.a.localeCompare(y.a):x.b.localeCompare(y.b)));
}

/* ---------- calculations ---------- */
function heads(upTo){
  const h={};S.groups.forEach(g=>h[g.id]=0);
  const add=(g,v)=>{if(g in h)h[g]+=v};
  for(const m of S.moves){if(upTo&&m.date>upTo)continue;const c=+m.count||0;
    if(m.type==='start'||m.type==='birth'||m.type==='buy')add(m.to,c);
    else if(m.type==='transfer'){add(m.from,-c);add(m.to,c)}
    else add(m.from,-c)}
  return h;
}
function stockCalc(){
  const m={};S.items.forEach(i=>m[i.id]={inQ:0,inS:0,outQ:0});
  for(const o of S.stock){const x=m[o.item];if(!x)continue;
    if(o.kind==='in'){const v=(+o.qty||0)*(+o.price||0);x.inQ+=+o.qty||0;x.inS+=v;if(o.exp===EXP_NOW)x.inSx=(x.inSx||0)+v}else x.outQ+=+o.qty||0}
  for(const v of S.vet)if(v.item&&m[v.item])m[v.item].outQ+=+v.qty||0;
  for(const e of S.sowev)if(e.type==='mate'&&e.semen&&m[e.semen])m[e.semen].outQ+=+(e.doses??1)||0;
  for(const k in m){const x=m[k];x.avg=x.inQ?x.inS/x.inQ:0}
  for(const k in m){const x=m[k];x.avgX=x.inQ?(x.inSx||0)/x.inQ:0}
  for(const p of S.prod){let cost=0,cx=0;for(const c of p.parts||[]){const x=m[c.item];if(!x)continue;x.outQ+=+c.qty||0;cost+=(+c.qty||0)*x.avg;cx+=(+c.qty||0)*x.avgX}
    const y=m[p.out];if(y){y.inQ+=+p.outQty||0;y.inS+=cost;y.inSx=(y.inSx||0)+cx}}
  for(const k in m){const x=m[k];x.bal=x.inQ-x.outQ;x.avg=x.inQ?x.inS/x.inQ:0;x.useAvg=x.inQ?(x.inS-(x.inSx||0))/x.inQ:0}
  return m;
}
function prodCost(p,sc){sc=sc||stockCalc();return (p.parts||[]).reduce((a,c)=>a+(+c.qty||0)*(sc[c.item]?.avg||0),0)}
function monthStats(){
  const sc=stockCalc();const prevEnd=month+'-00';
  const h0=heads(prevEnd);const start=Object.values(h0).reduce((a,b)=>a+b,0);
  const r={born:0,dead:0,stillborn:0,litters:0,bought:0,sold:0,soldKg:0,revenue:0,mat:{Корм:0,Ветпрепарат:0,Сперма:0,Інше:0},costs:{},pay:0};
  for(const m of S.moves)if(inMonth(m.date)){const c=+m.count||0;
    if(m.type==='birth'){r.born+=c;r.stillborn+=+m.dead||0;r.litters+=+m.litters||0}
    if(m.type==='buy')r.bought+=c;if(m.type==='start')r.started=(r.started||0)+c;
    if(m.type==='death')r.dead+=c;
    if(m.type==='sale'){r.sold+=c;r.soldKg+=+m.weight||0;r.revenue+=+m.sum||0}}
  const matAdd=(item,q)=>{const it=byId('items',item);if(!it)return;const k=isFeed(it.cat)?'Корм':it.cat==='Ветпрепарат'||it.cat==='Сперма'?it.cat:'Інше';r.mat[k]+=q*(sc[item]?.useAvg||0)};
  for(const e of S.sowev)if(e.type==='mate'&&e.semen&&inMonth(e.date))matAdd(e.semen,+(e.doses??1)||0);

  for(const c of S.costs)if(inMonth(c.date))r.costs[c.cat]=(r.costs[c.cat]||0)+(+c.sum||0);

  r.totalCost=Object.values(r.mat).reduce((a,b)=>a+b,0)+Object.values(r.costs).reduce((a,b)=>a+b,0)+r.pay;
  return r;
}

     ${sortJ(d.pays).map(p=>`<button class="li" data-a="edit" data-c="supay" data-id="${esc(p.id)}">${dateCell(p.date)}<div class="main"><div class="t"><span class="tag plus">Оплата</span></div>${p.note?`<div class="s">${esc(p.note)}</div>`:''}</div><div class="v num" style="color:var(--good)">−${money(p.sum)}</div></button>`).join('')}</div>

  else{const per={};pay.forEach(p=>{(per[p.worker]=per[p.worker]||{sum:0,works:[]});per[p.worker].sum+=+p.sum||0;if(p.work)per[p.worker].works.push(p.work)});
   body=`<div class="card"><h2>Зарплата по працівниках · ${money(ps)}</h2>${Object.keys(per).length?`<div class="list">${Object.entries(per).map(([w,x])=>{const wk=byId('workers',w);return `<div class="li"><div class="main"><div class="t">${esc(wk?.name||'—')}</div><div class="s">${esc([wk?.role,[...new Set(x.works)].join(', ')].filter(Boolean).join(' · '))}</div></div><div class="v num">${money(x.sum)}</div></div>`}).join('')}</div>`:'<p class="empty">Немає нарахувань у цьому місяці</p>'}</div>
   <div class="card"><h2>Нарахування</h2>${pay.length?`<div class="list">${pay.map(p=>`<button class="li" data-a="edit" data-c="pay" data-id="${esc(p.id)}">${dateCell(p.date)}<div class="main"><div class="t">${esc(byId('workers',p.worker)?.name||'—')}</div><div class="s">${esc(p.work||'')}</div></div><div class="v num">${money(p.sum)}</div></button>`).join('')}</div>`:'<p class="empty">—</p>'}</div>`}
  return (moneyView==='debt'?'':monthBar())+`<div class="seg" role="group"><button data-a="mv" data-v="costs" aria-pressed="${moneyView==='costs'}">Витрати</button><button data-a="mv" data-v="pay" aria-pressed="${moneyView==='pay'}">Зарплата</button><button data-a="mv" data-v="debt" aria-pressed="${moneyView==='debt'}">Борги</button></div>`+body;
}

function formKeyFor(col,doc){if(col==='supay')return 'supay';if(col==='moves'||col==='sowev')return doc.type;if(col==='stock')return doc.kind==='in'?'receipt':'feed';return {vet:'vet',costs:'cost',pay:'pay',groups:'group',items:'item',workers:'worker',vetplan:'plan',sows:'sow'}[col]}
function fieldHtml(f,v){
  const id='f_'+f.k,req=f.opt?'':' required',val=v??(f.t==='date'&&!f.opt?today():'');
  let ctl='';
  const options=(list,cur,empty)=>`<option value="">${empty}</option>`+list.map(o=>`<option value="${esc(o.id)}"${o.id===cur?' selected':''}>${esc(o.name)}</option>`).join('');
  if(f.t==='group'){let cur=val;if(!cur&&f.pref){cur=S.groups.find(g=>g.cat===f.pref)?.id||''}ctl=`<select id="${id}" name="${f.k}"${req}>${options(S.groups,cur,f.opt?'— не вказано —':'Оберіть групу')}</select>`}
  else if(f.t==='item'){const sc=stockCalc();const its=S.items.slice().sort((a,b)=>(b.cat===f.cat)-(a.cat===f.cat)||String(a.name).localeCompare(String(b.name),'uk'));ctl=`<select id="${id}" name="${f.k}"${req}>${options(its.map(i=>({id:i.id,name:i.name+' — '+n(sc[i.id]?.bal||0)+' '+i.unit})),val,f.opt?'— без препарату —':'Оберіть')}</select>`}
  else if(f.t==='sow'){const ss=S.sows.filter(s=>s.status!=='Вибракувана'||s.id===val).slice().sort((a,b)=>String(a.tag).localeCompare(String(b.tag),'uk',{numeric:true}));ctl=`<select id="${id}" name="${f.k}"${req}>${options(ss.map(s=>({id:s.id,name:'№ '+s.tag})),val,f.opt?'— не вказано —':'Оберіть свиноматку')}</select>`}
  else if(f.t==='supplier'){const list=suppliers();ctl=`<input id="${id}" name="${f.k}" type="text" list="dl_${id}" autocomplete="off" value="${esc(val)}"${req}><datalist id="dl_${id}">${list.map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`}
  else if(f.t==='worker')ctl=`<select id="${id}" name="${f.k}"${req}>${options(S.workers,val,'Оберіть працівника')}</select>`;
  else if(f.t==='sel')ctl=`<select id="${id}" name="${f.k}"${req}>${f.opts.map(o=>`<option${o===val?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(f.t==='int'||f.t==='num')ctl=`<input id="${id}" name="${f.k}" type="number" inputmode="${f.t==='int'?'numeric':'decimal'}" step="${f.t==='int'?1:'any'}" min="0" value="${esc(val)}"${req}>`;
  else ctl=`<input id="${id}" name="${f.k}" type="${f.t==='date'?'date':'text'}" value="${esc(val)}"${req}>`;
  return `<label class="f" for="${id}">${esc(f.l)}${ctl}</label>`;
}
let formExtra=null;
function openForm(key,doc,pre,extra,ov){formExtra=extra||null;ov=ov||{};
  const spec={...F[key],...(ov.title?{title:ov.title}:{}),...(ov.hint?{hint:ov.hint}:{}),...(ov.itemCat?{f:F[key].f.map(f=>f.t==='item'?{...f,cat:ov.itemCat,l:'Лінія сперми'}:f)}:{})};const need=spec.f.flatMap(f=>f.row||[f]).filter(f=>!f.opt).map(f=>f.t);
  let block='';
  if(need.includes('group')&&!S.groups.length)block='Спершу додайте хоча б одну групу тварин.';
  if(need.includes('item')&&!S.items.length)block='Спершу додайте матеріал (корм чи препарат).';
  if(need.includes('worker')&&!S.workers.length)block='Спершу додайте працівника.';
  if(need.includes('sow')&&!S.sows.length)block='Спершу додайте свиноматку.';
  if(block){sheet(`<h3>${esc(spec.title)}</h3><p>${block}</p><div class="btns"><button class="btn primary" data-a="form" data-k="${need.includes('sow')?'sow':need.includes('worker')?'worker':need.includes('item')?'item':'group'}">Додати</button></div>`);return}
  const v=doc||pre||{};
  const fh=spec.f.map(f=>f.row?`<div class="two">${f.row.map(x=>fieldHtml(x,v[x.k])).join('')}</div>`:fieldHtml(f,v[f.k])).join('');
  sheet(`<h3>${doc?'Редагувати: ':''}${esc(spec.title)}</h3><form id="frm" novalidate>${fh}${spec.hint?`<div class="hint">${esc(spec.hint)}</div>`:''}<div class="err" id="ferr" hidden></div>
   <div class="btns">${doc?`<button type="button" class="btn danger" data-a="delete" data-c="${spec.col}" data-id="${esc(doc.id)}">Видалити</button>`:''}<button class="btn primary" type="submit">Зберегти</button></div></form>`);
  const frm=document.getElementById('frm');
  frm.addEventListener('submit',async e=>{e.preventDefault();
    const out={},fl=spec.f.flatMap(f=>f.row||[f]);let err='';
    for(const f of fl){const el=frm.querySelector('[name="'+f.k+'"]');const raw=String(el?.value??'').trim();
      if(!raw){if(!f.opt)err=err||`Заповніть поле «${f.l}»`;continue}
      if(f.t==='int'||f.t==='num'){const x=Number(raw.replace(',','.'));if(!isFinite(x)||x<0){err=err||`«${f.l}»: потрібне додатне число`;continue}if(f.t==='int'&&!Number.isInteger(x)){err=err||`«${f.l}»: ціле число`;continue}out[f.k]=x}
      else out[f.k]=raw}
    if(!err&&spec.col==='moves'){
      if(['transfer','death','sale'].includes(spec.type)&&!(out.count>0))err='Кількість голів має бути більше нуля';
      if(spec.type==='transfer'&&out.from===out.to)err='Оберіть різні групи';
      if(!err&&out.from){const h=heads(out.date);let avail=h[out.from]||0;if(doc&&doc.from===out.from)avail+=+doc.count||0;
        if(out.count>avail)err=`У групі «${gname(out.from)}» на ${out.date} лише ${mf.format(avail)} гол.`}}
    if(!err&&spec.col==='vetplan'&&out.anchor!==A_NONE){if(out.from==null)err='Вкажіть, з якого дня робити';else if(out.to!=null&&(out.anchor===A_PRE?out.to>out.from:out.to<out.from))err=out.anchor===A_PRE?'Для «до опоросу»: «По» має бути меншим за «З» (напр. з 14 по 7)':'«По» не може бути меншим за «З»'}
    if(!err&&spec.type==='birth'&&out.sow&&!out.litters)out.litters=1;
    if(!err&&spec.type==='mate'&&out.semen&&out.doses==null)out.doses=1;
    if(!err&&spec.type==='mate'){const sw=byId('sows',out.sow);if(sw?.status==='Вибракувана')err='Свиноматка позначена як вибракувана'}
    if(!err&&spec.col==='vet'&&out.item&&!out.qty)err='Вкажіть, скільки препарату витрачено';
    const ferr=document.getElementById('ferr');if(err){ferr.textContent=err;ferr.hidden=false;return}
    if(spec.type)out.type=spec.type;if(spec.kind)out.kind=spec.kind;
    if(doc){out.t=doc.t;['demo','std','plan','batch'].forEach(k=>{if(doc[k]!=null)out[k]=doc[k]})}else if(formExtra)Object.assign(out,formExtra);
    const btn=frm.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Зберігаю…';
    try{await put(spec.col,doc?.id,out);closeSheet();toast('Збережено');
      if(spec.col==='stock'&&spec.kind==='out'){const sc=stockCalc()[out.item];if(sc&&sc.bal<0)toast('Збережено. Залишок пішов у мінус — внесіть прихід')}}
    catch(e){btn.disabled=false;btn.textContent='Зберегти';ferr.textContent=saveErr(e);ferr.hidden=false}
  });
}
function saveErr(e){return e?.code==='permission-denied'?'Немає доступу. Увійдіть знову.':e?.code==='quota_exceeded'?'Сховище заповнене. Видаліть старі записи й спробуйте ще раз.':'Не вдалося зберегти. Перевірте інтернет і спробуйте ще раз.'}
function inUse(col,id){if(col==='groups')return S.moves.some(m=>m.from===id||m.to===id)||S.stock.some(o=>o.group===id)||S.vet.some(v=>v.group===id);
  if(col==='items')return S.sowev.some(e=>e.semen===id)||S.prod.some(p=>p.out===id||(p.parts||[]).some(c=>c.item===id))||S.stock.some(o=>o.item===id)||S.vet.some(v=>v.item===id)||S.vetplan.some(p=>p.item===id);if(col==='workers')return S.pay.some(p=>p.worker===id);if(col==='sows')return S.sowev.some(e=>e.sow===id)||S.moves.some(m=>m.sow===id)||S.vet.some(v=>v.sow===id);return false}
function sheet(html){document.getElementById('layer').innerHTML=`<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  const f=document.querySelector('.sheet input,.sheet select,.sheet button');}
function closeSheet(){document.getElementById('layer').innerHTML=''}
function openProd(id){
  const doc=id?byId('prod',id):null;
  if(!S.items.length){sheet(`<h3>Виготовлення корму</h3><p>Спершу додайте сировину (зерно, премікс…) і готовий корм у довідник матеріалів.</p><div class="btns"><button class="btn primary" data-a="form" data-k="item">Додати матеріал</button></div>`);return}
  const sc=stockCalc();
  const itemsSorted=pref=>S.items.slice().sort((a,b)=>(b.cat===pref)-(a.cat===pref)||(a.t||0)-(b.t||0));
  const opts=(pref,cur,empty)=>`<option value="">${empty}</option>`+itemsSorted(pref).map(i=>`<option value="${esc(i.id)}"${i.id===cur?' selected':''}>${esc(i.name)} (${esc(i.unit)})</option>`).join('');
  const partRow=(c,k)=>`<div class="two prow" style="grid-template-columns:minmax(0,1fr) 96px 36px;align-items:end"><label class="f" for="pi${k}">Сировина<select id="pi${k}" class="pitem">${opts('Сировина',c.item,'Оберіть')}</select></label><label class="f" for="pq${k}">Кількість<input id="pq${k}" class="pqty" type="number" inputmode="decimal" step="any" min="0" value="${esc(c.qty??'')}"></label><button type="button" class="iconbtn" data-a="prodrm" aria-label="Прибрати рядок" style="width:36px;height:44px">×</button></div>`;
  const parts=doc?.parts?.length?doc.parts:[{},{},{}];
  sheet(`<h3>${doc?'Редагувати: ':''}Виготовлення корму</h3><form id="pfrm" novalidate>
   <label class="f" for="p_date">Дата<input id="p_date" type="date" value="${esc(doc?.date||today())}"></label>
   <div class="two"><label class="f" for="p_out">Готовий корм<select id="p_out">${opts('Готовий корм',doc?.out,'Оберіть')}</select></label>
   <label class="f" for="p_qty">Вийшло<input id="p_qty" type="number" inputmode="decimal" step="any" min="0" value="${esc(doc?.outQty??'')}"></label></div>
   <h4 style="margin:4px 0 0">Що пішло</h4><div id="parts" style="display:flex;flex-direction:column;gap:8px">${parts.map(partRow).join('')}</div>
   <button type="button" class="linkbtn" data-a="prodadd" style="align-self:flex-start">+ Ще компонент</button>
   <div class="note" id="psum">—</div>
   <label class="f" for="p_note">Примітка<input id="p_note" type="text" value="${esc(doc?.note||'')}"></label>
   <div class="err" id="ferr" hidden></div>
   <div class="btns">${doc?`<button type="button" class="btn danger" data-a="delete" data-c="prod" data-id="${esc(doc.id)}">Видалити</button>`:''}<button class="btn primary" type="submit">Зберегти</button></div></form>`);
  const f=document.getElementById('pfrm');let k=parts.length;
  const read=()=>[...f.querySelectorAll('.prow')].map(r=>({item:r.querySelector('.pitem').value,qty:Number(String(r.querySelector('.pqty').value).replace(',','.'))})).filter(c=>c.item||c.qty);
  const upd=()=>{const ps=read().filter(c=>c.item&&c.qty>0);const cost=ps.reduce((a,c)=>a+c.qty*(sc[c.item]?.avg||0),0);const tq=ps.reduce((a,c)=>a+c.qty,0);const oq=+f.querySelector('#p_qty').value||0;
    const it=byId('items',f.querySelector('#p_out').value);
    const low=ps.filter(c=>(sc[c.item]?.bal||0)+(doc?.parts||[]).filter(d=>d.item===c.item).reduce((a,d)=>a+(+d.qty||0),0)<c.qty).map(c=>byId('items',c.item)?.name);
    document.getElementById('psum').innerHTML=ps.length?`Сировини: <b class="num">${n(tq)}</b> · вартість <b class="num">${money(cost)}</b>${oq?` · собівартість <b class="num">${nf.format(cost/oq)} ₴/${esc(it?.unit||'од.')}</b>`:''}${oq&&tq?` · вихід ${nf.format(oq/tq*100)}%`:''}${low.length?`<br><span style="color:var(--warn)">Не вистачає на складі: ${esc(low.join(', '))} — залишок піде в мінус</span>`:''}`:'Додайте сировину, щоб побачити собівартість';};
  f.addEventListener('input',upd);f.addEventListener('change',e=>{
    if(e.target.id==='p_out'&&!doc&&!read().some(c=>c.item)){const last=sortJ(S.prod.filter(p=>p.out===e.target.value))[0];
      if(last){document.getElementById('parts').innerHTML=last.parts.map(partRow).join('');k=last.parts.length;if(!f.querySelector('#p_qty').value)f.querySelector('#p_qty').value=last.outQty;toast('Підставлено склад з останнього виготовлення')}}
    upd()});
  f.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='prodadd'){e.stopPropagation();document.getElementById('parts').insertAdjacentHTML('beforeend',partRow({},k++))}
    if(b.dataset.a==='prodrm'){e.stopPropagation();b.closest('.prow').remove();upd()}});
  upd();
  f.addEventListener('submit',async e=>{e.preventDefault();const fe=document.getElementById('ferr');
    const out=f.querySelector('#p_out').value,oq=Number(String(f.querySelector('#p_qty').value).replace(',','.')),date=f.querySelector('#p_date').value;
    const ps=read();let err='';
    if(!date)err='Вкажіть дату';else if(!out)err='Оберіть готовий корм';else if(!(oq>0))err='Вкажіть, скільки вийшло готового корму';
    else if(ps.some(c=>!c.item||!(c.qty>0)))err='У кожному рядку сировини оберіть матеріал і вкажіть кількість (порожні рядки приберіть ×)';
    else if(!ps.length)err='Додайте хоча б один компонент';else if(ps.some(c=>c.item===out))err='Готовий корм не може бути власною сировиною';
    if(err){fe.textContent=err;fe.hidden=false;return}
    const data={date,out,outQty:oq,parts:ps,note:f.querySelector('#p_note').value.trim(),t:doc?.t||Date.now()};
    const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Зберігаю…';
    try{await put('prod',doc?.id,data);closeSheet();toast('Збережено: +'+n(oq)+' '+(byId('items',out)?.unit||''))}catch(x){btn.disabled=false;btn.textContent='Зберегти';fe.textContent=saveErr(x);fe.hidden=false}});
}

function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

  const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;window.scrollTo(0,0);render();return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;

  else if(a==='litter')litterSheet(b.dataset.id);
  else if(a==='godebt'){tab='money';moneyView='debt';window.scrollTo(0,0);render()}
  else if(a==='gorem'){tab='vet';vetView='rem';window.scrollTo(0,0);render()}
  else if(a==='rem')remSheet(b.dataset.b,b.dataset.p);
  else if(a==='stdplan'){b.disabled=true;try{await addStdPlan()}catch(err){toast(saveErr(err))}}
  else if(a==='remdo'){const r=reminders().find(x=>x.batch===b.dataset.b&&x.p.id===b.dataset.p);if(!r)return;const p=r.p;const act=remAction(r);
    const dm=(r.m||r.ev)?.demo?{demo:true}:{};
    if(act===ACT_DONE){try{await put('vetskip',r.batch+'__'+p.id,{batch:r.batch,plan:p.id,done:true,date:today(),...(r.sow?{sow:r.sow.id}:{}),...dm});closeSheet();toast('Позначено виконаним')}catch(err){toast(saveErr(err))}return}

    if(act===ACT_FARROW){openForm('birth',null,{sow:r.sow.id,litters:1});return}
    if(act===ACT_WEAN){openForm('wean',null,{sow:r.sow.id});return}
    const sel=document.getElementById('remitem');let useItem=byId('items',p.item)?p.item:'';
    if(sel){useItem=sel.value;if(document.getElementById('remkeep')?.checked&&useItem!==(p.item||'')){const{id:_i,...rest}=p;try{await put('vetplan',p.id,{...rest,item:useItem})}catch(err){}}}
    const sowG=S.groups.find(g=>g.cat==='Свиноматки');
    const pre=r.sow?{group:r.sow.group||sowG?.id||'',heads:1,note:p.name+' · '+tagOf(r.sow.id)}:{group:p.target==='Свиноматки'&&sowG?sowG.id:r.m?.to,heads:p.target==='Свиноматки'?(+r.m?.litters||''):r.m?.count,note:p.name};
    openForm('vet',null,{...pre,kind:/вакцин/i.test(p.name)?'Щеплення':'Обробка',item:useItem},{plan:p.id,batch:r.batch,...(r.sow?{sow:r.sow.id}:{}),...dm})}
  else if(a==='remskip'){const r=reminders().find(x=>x.batch===b.dataset.b&&x.p.id===b.dataset.p);const dm=(r?.m||r?.ev)?.demo?{demo:true}:{};
    try{await put('vetskip',b.dataset.b+'__'+b.dataset.p,{batch:b.dataset.b,plan:b.dataset.p,...dm});closeSheet();toast('Прибрано з нагадувань')}catch(err){toast(saveErr(err))}}
  else if(a==='sow')sowSheet(b.dataset.id);
  else if(a==='semen')semenSheet(b.dataset.id);
  else if(a==='semnew')openForm('item',null,{cat:'Сперма',unit:'доза'},null,{title:'Нова лінія сперми',hint:'Наприклад: «Сперма Дюрок» або номер кабана. Далі внесіть прихід доз.'});
  else if(a==='semin'){const id=b.dataset.id||S.items.find(i=>i.cat==='Сперма')?.id||'';openForm('receipt',null,{item:id,exp:EXP_USE},null,{title:'Прихід доз сперми',itemCat:'Сперма',hint:'Ціна — за одну дозу. Вартість піде у витрати, коли доза буде використана при осіменінні.'})}
  else if(a==='sowev'){const k=b.dataset.k,id=b.dataset.id;openForm(k,null,k==='birth'?{sow:id,litters:1}:{sow:id})}
  else if(a==='more'){herdShow+=40;render()}
  else if(a==='demo'){b.disabled=true;try{await loadDemo()}catch(err){toast(saveErr(err))}}
  else if(a==='cleardemo'){if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Натисніть ще раз — видалити приклад';return}closeSheet();try{await clearDemo()}catch(err){toast(saveErr(err))}}
  else if(a==='delete'){const{c,id}=b.dataset;
    if(inUse(c,id)){const fe=document.getElementById('ferr');fe.textContent='Цей запис використовується в журналі — спершу видаліть пов\'язані операції.';fe.hidden=false;return}
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Точно видалити?';return}
    try{await del(c,id);closeSheet();toast('Видалено')}catch(err){toast(saveErr(err))}}

function authErr(e){const c=e?.code||'';return c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')?'Неправильна пошта або пароль':c.includes('email-already')?'Такий акаунт уже є — натисніть «Увійти»':c.includes('weak-password')?'Пароль має бути щонайменше 6 символів':c.includes('invalid-email')?'Перевірте адресу пошти':c.includes('network')?'Немає інтернету. Для першого входу потрібен зв\'язок':c.includes('too-many')?'Забагато спроб. Зачекайте кілька хвилин':'Не вдалося: '+c}

function exportData(){const out={app:'klg-agro',version:1,exported:new Date().toISOString(),data:{}};COLS.forEach(c=>out.data[c]=S[c]);
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='klg-agro-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Файл збережено')}
async function importData(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){toast('Це не файл резервної копії KLG Agro');return}
  const data=j?.data;if(!data||typeof data!=='object'){toast('У файлі немає даних KLG Agro');return}
  const ops=[];for(const c of COLS)for(const d of (data[c]||[])){if(!d||!d.id)continue;const{id,...rest}=d;ops.push([c,String(id),rest])}
  if(!ops.length){toast('Файл порожній');return}
  toast('Імпорт: '+ops.length+' записів…');
  for(let i=0;i<ops.length;i+=400){const batch=fs.batch();for(const[c,id,d] of ops.slice(i,i+400))batch.set(db.collection(c).doc(id),d);batch.commit().catch(e=>toast(saveErr(e)))}
  closeSheet();toast('Імпортовано записів: '+ops.length);
}
function startData(u){unsubs.forEach(f=>f());unsubs=[];COLS.forEach(c=>S[c]=[]);
  if(!u){user=null;db=null;mode='login';render();return}
  user=u;const root=fs.collection('users').doc(u.uid);db={collection:c=>root.collection(c)};mode='loading';render();const got=new Set();
  COLS.forEach(c=>unsubs.push(root.collection(c).onSnapshot(s=>{S[c]=s.docs.map(x=>({id:x.id,...x.data()}));got.add(c);if(got.size===COLS.length&&mode==='loading')mode='db';schedule()},err=>{toast('Помилка доступу до даних: '+(err.code||''))})));
}

  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey){mode='noconfig';render();return}
  firebase.initializeApp(cfg);fs=firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  render();
  firebase.auth().onAuthStateChanged(startData);
})();
</script>
</body>
